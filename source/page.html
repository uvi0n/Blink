<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перелёт · Передача файлов</title>
<style>*{box-sizing:border-box}body{margin:0;color:#edf3f4;background:#11181f;font:17px/1.5 "Segoe UI",system-ui,sans-serif}main{max-width:760px;margin:7vh auto;padding:20px}header{font-size:22px;font-weight:700;margin-bottom:30px}header b{background:#ffae79;color:#20272b;border-radius:12px;padding:5px 10px;margin-right:8px}article{overflow:hidden;background:#1d2932;border:1px solid #37444d;border-radius:24px;box-shadow:0 18px 60px #30214712}.cover{padding:34px;background:repeating-radial-gradient(circle at 110% 128%,transparent 0 18px,#ffffff18 19px 20px,transparent 21px 38px),#34444e;color:white}h1{font-size:clamp(32px,6vw,50px);letter-spacing:-.055em;line-height:1.05;margin:0}ul{list-style:none;padding:0;margin:0}li,.upload{padding:20px clamp(16px,4vw,32px)}li{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid #35404a}li:last-child{border:none}strong,small{display:block;overflow-wrap:anywhere}small,footer{color:#b6c5cd}a,button{border:0;border-radius:10px;color:#24201d;background:#ffae79;font-size:15px;font-family:inherit;font-weight:600;padding:11px 16px;text-decoration:none;cursor:pointer}input{max-width:100%;margin:14px 0}footer{font-size:14px;margin:18px 4px}progress{width:100%}body[data-mode=send] .upload,body[data-mode=receive] .download,[hidden]{display:none}.bulk{display:inline-block;margin-top:18px}.zipnote{font-size:14px;margin-left:12px;color:#e0e9eb}li input{width:19px;height:19px;accent-color:#ffae79;flex-shrink:0}li div{flex:1;min-width:0}#selection{padding:14px 22px 0}#subset{background:#354653;color:white}#subset:disabled{opacity:.55}</style>
<body data-mode="@MODE@"><main><header><b>↗</b> Перелёт</header><article><div class="cover"><h1 class="download">Файлы для вас</h1><a class="download bulk" href="all.zip" download>Скачать всё</a><span class="download zipnote">ZIP · без сжатия</span><h1 class="upload">Отправить файл</h1></div><form id="selection" method="post" action="selected.zip" class="download"><button disabled id="subset">Скачать выбранные</button></form><ul class="download">@FILES@</ul><div class="upload"><small>Сохранение на компьютере</small><strong>@TARGET@</strong><input id="pick" type="file" aria-label="Выбор файла"><br><button id="start">Отправить</button><p id="status" role="status"></p><progress id="bar" hidden></progress></div></article><footer>Владелец может отозвать ссылку. Для передачи его компьютер должен быть онлайн.</footer></main><script src="ui.js"></script></body></html>
